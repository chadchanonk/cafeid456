<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>MENU Café 456 — Soft Serve</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: #fff9f5;
    font-family: 'IBM Plex Sans', 'Noto Sans Thai', sans-serif;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .page {
    width: 100%;
    min-height: 100vh;
    height: auto;
    background: #fff9f5;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .border-frame {
    position: absolute;
    inset: 12px;
    border: 1.5px solid #3d1a0a;
    pointer-events: none;
    z-index: 10;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 0.5px solid #c47a3a;
  }
  .corner { position: absolute; font-size: 13px; color: #3d1a0a; line-height: 1; }
  .corner.tl { top: 16px; left: 16px; }
  .corner.tr { top: 16px; right: 16px; transform: scaleX(-1); }
  .corner.bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
  .corner.br { bottom: 16px; right: 16px; transform: scale(-1,-1); }

  .inner {
    position: relative;
    z-index: 1;
    padding: clamp(16px, 4vw, 26px) clamp(20px, 5vw, 44px) clamp(14px, 3vw, 18px);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Header */
  .cafe-name {
    text-align: center;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 700;
    letter-spacing: clamp(4px, 2vw, 12px);
    color: #1a0800;
    line-height: 1;
    flex-shrink: 0;
  }
  .cafe-sub {
    text-align: center;
    font-size: clamp(9px, 2.2vw, 10.5px);
    font-weight: 400;
    letter-spacing: 3px;
    color: #c47a3a;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .page-title {
    text-align: center;
    font-size: clamp(9px, 2.5vw, 12px);
    font-weight: 700;
    color: #3d1a0a;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 5px;
    padding-bottom: 6px;
    border-bottom: 1.5px solid #3d1a0a;
    flex-shrink: 0;
  }
  .page-subtitle {
    text-align: center;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 10px;
    color: #c47a3a;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: #3d1a0a;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    padding-bottom: 3px;
    border-bottom: 1px solid #c47a3a;
    flex-shrink: 0;
    margin-top: 8px;
  }

  /* ── FEATURED: Soft Matcha — centred, full width ── */
  .featured-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #d4b896;
    flex: 2.2;
    padding: 8px 0 6px;
  }
  .featured-img {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .featured-img img {
    max-width: 260px;
    max-height: 100%;
    width: auto;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    mix-blend-mode: multiply;
  }
  .featured-text {
    text-align: center;
    flex-shrink: 0;
    margin-top: 10px;
  }
  .featured-en {
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 700;
    color: #1a0800;
    display: block;
    line-height: 1.15;
  }
  .featured-th {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: clamp(16px, 4.5vw, 22px);
    font-weight: 600;
    color: #c47a3a;
    display: block;
    line-height: 1.2;
    margin-top: 2px;
  }
  .featured-price {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 700;
    color: #3d1a0a;
    display: block;
    margin-top: 6px;
  }

  /* ── 2-col grid for 4 remaining items ── */
  .two-col-grid {
    display: flex;
    gap: 0;
    flex: 3;
    min-height: 0;
  }
  .grid-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .grid-col:first-child {
    border-right: 1px solid #e8d8c8;
    padding-right: 10px;
  }
  .grid-col:last-child {
    padding-left: 10px;
  }
  .grid-row {
    display: flex;
    align-items: stretch;
    border-bottom: 0.5px solid #ece4d8;
    flex: 1;
    min-height: 0;
    gap: 8px;
  }
  .grid-row:last-child { border-bottom: none; }

  /* Image fills full cell height */
  .grid-img {
    flex-shrink: 0;
    width: 160px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 4px 0;
    align-self: stretch;
  }
  .grid-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    mix-blend-mode: multiply;
  }

  .grid-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .grid-en {
    font-size: clamp(12px, 3.5vw, 17px);
    font-weight: 700;
    color: #1a0800;
    display: block;
    line-height: 1.2;
  }
  .grid-th {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: clamp(11px, 3.2vw, 17px);
    font-weight: 600;
    color: #c47a3a;
    display: block;
    line-height: 1.2;
    margin-top: 3px;
  }
  .grid-price {
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 700;
    color: #3d1a0a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(36px, 9vw, 48px);
  }

  /* Footer */
  .footer-area { flex-shrink: 0; margin-top: 6px; }
  .divider-ornament { text-align: center; font-size: 9px; color: #c47a3a; letter-spacing: 6px; margin-bottom: 4px; }
  .footer { text-align: center; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: #c47a3a; text-transform: uppercase; }

  @media (max-width: 480px) {
    .featured-img img { max-width: 180px; }
    .grid-img { width: 100px; }
    .two-col-grid { flex-direction: column; }
    .grid-col:first-child { border-right: none; border-bottom: 1px solid #e8d8c8; padding-right: 0; padding-bottom: 8px; }
    .grid-col:last-child { padding-left: 0; padding-top: 8px; }
  }
</style>
</head>
