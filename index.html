<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENU Café 456</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #faf7f2;
    --brown: #2c1a0e;
    --gold:  #c9a96e;
    --tab-h: 68px;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'IBM Plex Sans', 'Noto Sans Thai', sans-serif;
    overflow: hidden;
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Content viewer: normal scrollable div, no iframe ── */
  .viewer {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--cream);
    min-height: 0;
    position: relative;
  }

  /* Loading overlay */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loading.show { opacity: 1; pointer-events: all; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid rgba(44,26,14,0.12);
    border-top-color: var(--brown);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Bottom tab bar ── */
  .tab-bar {
    flex-shrink: 0;
    height: var(--tab-h);
    background: var(--brown);
    display: flex;
    align-items: stretch;
    border-top: 1px solid rgba(201,169,110,0.25);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 4px;
    position: relative;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 16%; right: 16%;
    height: 2px;
    background: var(--gold);
    border-radius: 0 0 2px 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .tab-btn.active::after { opacity: 1; }
  .tab-btn.active { background: rgba(201,169,110,0.08); }

  .tab-en {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1;
    transition: color 0.2s;
  }
  .tab-th {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: rgba(201,169,110,0.4);
    line-height: 1;
    transition: color 0.2s;
  }
  .tab-btn.active .tab-en { color: #fff; }
  .tab-btn.active .tab-th { color: var(--gold); }

  .tab-btn + .tab-btn {
    border-left: 1px solid rgba(201,169,110,0.12);
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Content area: injected via fetch, no iframes -->
  <main class="viewer" id="viewer">
    <div class="loading show" id="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-0" onclick="showPage(0)">
      <span class="tab-en">Coffee</span>
      <span class="tab-th">เมนูกาแฟ</span>
    </button>
    <button class="tab-btn" id="tab-1" onclick="showPage(1)">
      <span class="tab-en">Matcha</span>
      <span class="tab-th">เมนูมัทฉะ</span>
    </button>
    <button class="tab-btn" id="tab-2" onclick="showPage(2)">
      <span class="tab-en">Soft Serve</span>
      <span class="tab-th">ซอฟต์เสิร์ฟ</span>
    </button>
  </nav>

</div>

<script>
  const urls = [
    'menu_page1_coffee.html',
    'menu_page2_matcha.html',
    'menu_page3_soft.html',
  ];

  const tabs   = [0, 1, 2].map(i => document.getElementById('tab-' + i));
  const viewer  = document.getElementById('viewer');
  const loading = document.getElementById('loading');

  // Cache fetched HTML strings so we only fetch once per session
  const cache = {};
  let current = 0;

  async function showPage(idx) {
    if (idx === current && cache[idx]) return;

    // Update tab highlight
    tabs[current].classList.remove('active');
    tabs[idx].classList.add('active');
    current = idx;

    // Show spinner
    loading.classList.add('show');

    // Fetch if not cached
    if (!cache[idx]) {
      try {
        const res  = await fetch(urls[idx]);
        cache[idx] = await res.text();
      } catch (e) {
        loading.classList.remove('show');
        viewer.innerHTML = '<p style="padding:24px;color:#c00">Failed to load menu. Please refresh.</p>';
        return;
      }
    }

    // Parse the fetched HTML
    const doc = new DOMParser().parseFromString(cache[idx], 'text/html');

    // --- Style isolation ---
    // Remove any previously injected page styles
    document.querySelectorAll('style[data-page]').forEach(s => s.remove());

    // Inject this page's <style> into <head> so it scopes correctly
    doc.querySelectorAll('style').forEach(s => {
      const tag = document.createElement('style');
      tag.setAttribute('data-page', idx);
      tag.textContent = s.textContent;
      document.head.appendChild(tag);
    });

    // Inject body content (everything inside <body>)
    // Scroll back to top first
    viewer.scrollTop = 0;

    // Clear old content (keep the loading div)
    viewer.innerHTML = '';
    viewer.appendChild(loading);

    const wrapper = document.createElement('div');
    wrapper.innerHTML = doc.body.innerHTML;
    viewer.appendChild(wrapper);

    loading.classList.remove('show');
  }

  // Swipe left/right to switch tabs
  let touchStartX = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) {
      if (dx < 0) showPage((current + 1) % 3);
      else        showPage((current + 2) % 3);
    }
  }, { passive: true });

  // Load first page on startup
  showPage(0);
</script>

</body>
</html>
