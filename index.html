<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENU Café 456</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream:   #faf7f2;
    --brown:   #2c1a0e;
    --gold:    #c9a96e;
    --tab-h:   68px;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'IBM Plex Sans', 'Noto Sans Thai', sans-serif;
    overflow: hidden;
  }

  /* ── Full-screen shell ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Scrollable iframe area ── */
  .viewer {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--cream);
    min-height: 0;
  }

  .page-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    /* iOS Safari: allow iframe to scroll */
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
  }
  .page-frame.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* Loading overlay */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 5;
  }
  .loading.show { opacity: 1; pointer-events: all; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid rgba(44,26,14,0.12);
    border-top-color: var(--brown);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Bottom tab bar ── */
  .tab-bar {
    flex-shrink: 0;
    height: var(--tab-h);
    background: var(--brown);
    display: flex;
    align-items: stretch;
    border-top: 1px solid rgba(201,169,110,0.25);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 4px;
    position: relative;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 16%; right: 16%;
    height: 2px;
    background: var(--gold);
    border-radius: 0 0 2px 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .tab-btn.active::after { opacity: 1; }
  .tab-btn.active { background: rgba(201,169,110,0.08); }

  .tab-en {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1;
    transition: color 0.2s;
  }
  .tab-th {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: rgba(201,169,110,0.4);
    line-height: 1;
    transition: color 0.2s;
  }
  .tab-btn.active .tab-en { color: #fff; }
  .tab-btn.active .tab-th { color: var(--gold); }

  /* Dividers between tabs */
  .tab-btn + .tab-btn {
    border-left: 1px solid rgba(201,169,110,0.12);
  }
</style>
</head>
<body>

<div class="shell">

  <!-- iframe viewer -->
  <main class="viewer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <iframe class="page-frame visible" id="frame-0"
      src="menu_page1_coffee.html?v=2" title="Coffee & Non-Coffee" scrolling="yes"></iframe>
    <iframe class="page-frame" id="frame-1"
      src="menu_page2_matcha.html?v=2" title="Matcha" scrolling="yes"></iframe>
    <iframe class="page-frame" id="frame-2"
      src="menu_page3_soft.html?v=2" title="Soft Serve" scrolling="yes"></iframe>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-0" onclick="showPage(0, this)">
      <span class="tab-en">Coffee</span>
      <span class="tab-th">เมนูกาแฟ</span>
    </button>
    <button class="tab-btn" id="tab-1" onclick="showPage(1, this)">
      <span class="tab-en">Matcha</span>
      <span class="tab-th">เมนูมัทฉะ</span>
    </button>
    <button class="tab-btn" id="tab-2" onclick="showPage(2, this)">
      <span class="tab-en">Soft Serve</span>
      <span class="tab-th">ซอฟต์เสิร์ฟ</span>
    </button>
  </nav>

</div>

<script>
  let current = 0;
  const frames = [
    document.getElementById('frame-0'),
    document.getElementById('frame-1'),
    document.getElementById('frame-2'),
  ];
  const tabs = [
    document.getElementById('tab-0'),
    document.getElementById('tab-1'),
    document.getElementById('tab-2'),
  ];
  const loading = document.getElementById('loading');

  function showPage(idx) {
    if (idx === current) return;
    loading.classList.add('show');
    setTimeout(() => {
      frames[current].classList.remove('visible');
      tabs[current].classList.remove('active');
      current = idx;
      frames[current].classList.add('visible');
      tabs[current].classList.add('active');
      loading.classList.remove('show');
    }, 180);
  }

  // Swipe support
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) showPage((current + 1) % 3);
      else showPage((current + 2) % 3);
    }
  }, { passive: true });
</script>

</body>
</html>
